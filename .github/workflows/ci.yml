name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Run unit tests
        run: |
          cd Lucid
          swift test

      - name: Concurrency warning build
        run: |
          cd Lucid
          swift build -Xswiftc -warn-concurrency --target Lucid

      - name: Release target build
        run: |
          cd Lucid
          swift build --configuration release --target Lucid

      - name: Verify app bundle + signature
        run: |
          cd Lucid
          ./build-app.sh debug
          APP="$(swift build --configuration debug --show-bin-path)/Lucid.app"
          codesign --verify --deep --strict "$APP"
